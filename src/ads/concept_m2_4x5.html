<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ad M2 — 4:5 (1080x1350) — THỢ ĐẤT MỎ (IT / MÁY TÍNH v01)</title>
  <link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1350px;
      background: #080808;
      color: #FFFFFF;
      font-family: 'Be Vietnam Pro', sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px;
    }
    .grid-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none;
    }
    .top-bar {
      position: relative; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo-container {
      background: #FFFFFF; padding: 10px 22px; border-radius: 6px;
      display: inline-flex; align-items: center;
    }
    .logo-container img { height: 52px; width: auto; display: block; }
    .top-tag {
      background: #080808; color: #FFD200; border: 2px solid #FFD200;
      font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700;
      letter-spacing: 1px; padding: 10px 24px; border-radius: 4px; text-transform: uppercase;
    }
    .hero-box {
      position: relative; z-index: 2;
      background: #111111; color: #FFFFFF;
      border-radius: 12px; padding: 56px 52px; margin: 28px 0;
      border-left: 10px solid #FFD200;
      flex: 1;
    }
    .label-row {
      display: flex; align-items: center; gap: 16px; margin-bottom: 32px;
    }
    .label-pill {
      display: inline-block; background: #FFD200; color: #080808;
      font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700;
      letter-spacing: 1px; padding: 8px 20px; border-radius: 4px; text-transform: uppercase;
    }
    .label-sub {
      font-family: 'Be Vietnam Pro', sans-serif; font-size: 28px; font-weight: 700;
      color: #FFFFFF; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .main-title {
      font-family: 'Oswald', sans-serif; font-size: 88px; font-weight: 700;
      line-height: 1.25; text-transform: uppercase; letter-spacing: 0.5px;
      color: #FFFFFF; margin-bottom: 36px;
    }
    .main-title span { color: #FFD200; }
    .desc-box {
      background: #1C1C1C; border-radius: 6px; padding: 28px 32px;
    }
    .desc-title {
      font-family: 'Oswald', sans-serif; font-size: 30px; font-weight: 700;
      color: #FFD200; letter-spacing: 0.5px; margin-bottom: 14px; text-transform: uppercase;
    }
    .desc-text {
      font-family: 'Be Vietnam Pro', sans-serif; font-size: 30px; font-weight: 400;
      color: #FFFFFF; line-height: 1.6;
    }
    .mid-bar {
      position: relative; z-index: 2;
      background: #FFD200; color: #080808;
      font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 20px 32px; border-radius: 6px; text-align: center;
    }
    .bottom-cta {
      position: relative; z-index: 2;
      background: #080808; border: 3px solid #FFD200; border-radius: 8px;
      padding: 24px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .cta-text {
      font-family: 'Oswald', sans-serif; font-size: 38px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase; color: #FFFFFF;
    }
    .cta-text span { color: #FFD200; }
    .hotline-btn {
      background: #FFD200; color: #080808;
      font-family: 'Oswald', sans-serif; font-size: 48px; font-weight: 700;
      letter-spacing: 1px; padding: 12px 32px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="top-bar">
    <div class="logo-container">
      <img src="../../assets/logo-derived/THO-DAT-MO_LOGO_HORIZONTAL_crop_v01.png" alt="THỢ ĐẤT MỎ">
    </div>
    <div class="top-tag">CẨM PHẢ • QUẢNG NINH</div>
  </div>

  <div class="hero-box">
    <div class="label-row">
      <div class="label-pill">TẠI CẨM PHẢ</div>
      <div class="label-sub">MÁY TÍNH & PC TẬN NƠI</div>
    </div>
    <div class="main-title">
      <div>CÀI ĐẶT PHẦN MỀM.</div>
      <div><span>THỢ ĐẤT MỎ</span> NHẬN.</div>
    </div>
    <div class="desc-box">
      <div class="desc-title">VIỆC KỸ THUẬT, CÓ THỢ ĐẤT MỎ</div>
      <div class="desc-text">Tư vấn cấu hình máy tính. Lắp ráp PC tại Cẩm Phả.</div>
    </div>
  </div>

  <div class="mid-bar">LẮP RÁP PC & CÀI ĐẶT PHẦN MỀM</div>

  <div class="bottom-cta">
    <div class="cta-text">
      CẦN THỢ? <span>GỌI THỢ ĐẤT MỎ</span>
    </div>
    <div class="hotline-btn">0888 942 247</div>
  </div>
</body>
</html>
