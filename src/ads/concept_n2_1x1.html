<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Ad N2 — 1:1 (1080x1080) — THỢ ĐẤT MỎ (LOCAL v02)</title>
  <link rel="stylesheet" href="../../assets/tokens.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1080px;
      background-color: var(--tdm-color-black);
      color: #FFFFFF;
      font-family: var(--tdm-font-body);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 70px;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 210, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 210, 0, 0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }
    .logo-badge {
      background: #FFFFFF;
      padding: 10px 24px;
      border-radius: var(--tdm-radius-sm);
      border-left: 6px solid var(--tdm-color-yellow);
      display: flex;
      align-items: center;
    }
    .logo-img {
      height: 48px;
      width: auto;
    }
    .location-tag {
      background: var(--tdm-color-yellow);
      color: var(--tdm-color-black);
      font-family: var(--tdm-font-display);
      font-size: 26px;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: var(--tdm-radius-sm);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Central Industrial Card: Local Angle */
    .center-card {
      background: #141414;
      border: 3px solid var(--tdm-color-yellow);
      border-radius: var(--tdm-radius-md);
      padding: 44px 48px;
      position: relative;
      z-index: 2;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .area-badge {
      background: var(--tdm-color-yellow);
      color: var(--tdm-color-black);
      font-family: var(--tdm-font-display);
      font-size: 26px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--tdm-radius-sm);
      text-transform: uppercase;
    }
    .eyebrow-text {
      font-family: var(--tdm-font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #FFFFFF;
    }
    .main-headline {
      font-family: var(--tdm-font-display);
      font-size: 64px;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 24px;
    }
    .main-headline span {
      color: var(--tdm-color-yellow);
    }
    .hub-box {
      background: #0A0A0A;
      border-left: 5px solid var(--tdm-color-yellow);
      padding: 18px 24px;
      border-radius: 0 var(--tdm-radius-sm) var(--tdm-radius-sm) 0;
      margin-bottom: 16px;
    }
    .hub-title {
      font-family: var(--tdm-font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--tdm-color-yellow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .hub-desc {
      font-size: 26px;
      color: #FFFFFF;
      font-weight: 500;
    }

    /* Secondary Support Bar */
    .service-badge-bar {
      display: flex;
      gap: 16px;
      z-index: 2;
    }
    .service-tag {
      flex: 1;
      background: var(--tdm-color-yellow);
      color: var(--tdm-color-black);
      padding: 16px 20px;
      border-radius: var(--tdm-radius-sm);
      font-family: var(--tdm-font-display);
      font-size: 26px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Bottom CTA Bar */
    .cta-bar {
      background: #111111;
      border: 2px solid var(--tdm-color-yellow);
      border-radius: var(--tdm-radius-sm);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }
    .cta-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cta-action {
      font-family: var(--tdm-font-display);
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cta-action span {
      color: var(--tdm-color-yellow);
    }
    .cta-phone-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--tdm-color-yellow);
      color: var(--tdm-color-black);
      padding: 14px 26px;
      border-radius: var(--tdm-radius-sm);
      box-shadow: 0 4px 16px rgba(255, 210, 0, 0.3);
    }
    .phone-number {
      font-family: var(--tdm-font-display);
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <!-- Header -->
  <div class="header" id="ad-header">
    <div class="logo-badge" id="ad-logo">
      <img src="../../assets/logo-derived/THO-DAT-MO_LOGO_HORIZONTAL_transparent_v01.png" alt="THỢ ĐẤT MỎ" class="logo-img">
    </div>
    <div class="location-tag">CẨM PHẢ • QUẢNG NINH</div>
  </div>

  <!-- Center Graphic Card: Local Angle -->
  <div class="center-card">
    <div class="card-eyebrow">
      <span class="area-badge">TẠI CẨM PHẢ</span>
      <span class="eyebrow-text">KỸ THUẬT TẬN NƠI</span>
    </div>
    <div class="main-headline" id="ad-title">
      CẦN SỬA ĐIỀU HÒA?<br><span>THỢ ĐẤT MỎ.</span>
    </div>
    <div class="hub-box">
      <div class="hub-title">ĐẦU MỐI KẾT NỐI THỢ TẬN NƠI</div>
      <div class="hub-desc">Kiểm tra sự cố tận nơi, xử lý đúng bệnh điều hòa.</div>
    </div>
  </div>

  <!-- Secondary Support Bar (chỉ giữ dịch vụ sửa chữa) -->
  <div class="service-badge-bar">
    <div class="service-tag">SỬA CHỮA ĐIỀU HÒA TẬN NƠI</div>
  </div>

  <!-- Bottom CTA -->
  <div class="cta-bar" id="ad-cta">
    <div class="cta-left">
      <div class="cta-action">CẦN THỢ? <span>GỌI THỢ ĐẤT MỎ</span></div>
    </div>
    <div class="cta-phone-btn" id="ad-hotline">
      <span class="phone-number">0888 942 247</span>
    </div>
  </div>
</body>
</html>
