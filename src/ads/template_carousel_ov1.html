<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Carousel Slide</title>
  <link rel="stylesheet" href="../../assets/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1350px;
      background: #080808;
      color: #FFFFFF;
      font-family: 'Be Vietnam Pro', sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px;
    }
    .grid-bg {
      position: absolute; inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none;
    }
    .top-bar {
      position: relative; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo-container {
      background: #FFFFFF; padding: 10px 22px; border-radius: 6px;
      display: inline-flex; align-items: center;
    }
    .logo-container img { height: 52px; width: auto; display: block; }
    .top-tag {
      background: #FFD200; color: #080808;
      font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700;
      letter-spacing: 1px; padding: 10px 24px; border-radius: 4px; text-transform: uppercase;
    }

    .hero-box {
      position: relative; z-index: 2;
      background: #FFD200; color: #080808;
      border-radius: 12px; padding: 60px 52px;
      margin: auto 0;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .slide-num {
      display: inline-block; background: #080808; color: #FFD200;
      font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700;
      letter-spacing: 1px; padding: 8px 20px; border-radius: 4px; text-transform: uppercase;
      margin-bottom: 28px;
    }
    .slide-icon {
      color: #080808; margin-bottom: 28px;
      display: flex; align-items: center; justify-content: center;
    }
    .main-title {
      font-family: 'Oswald', sans-serif; font-size: 88px; font-weight: 700;
      line-height: 1.25; text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 28px;
    }
    .desc-box {
      background: #080808; color: #FFFFFF;
      border-radius: 8px; padding: 24px 32px;
      font-size: 32px; font-weight: 700;
      line-height: 1.4; width: 100%;
    }

    .bottom-cta {
      position: relative; z-index: 2;
      background: #080808; border: 3px solid #FFD200; border-radius: 8px;
      padding: 24px 32px; display: flex; justify-content: space-between; align-items: center;
    }
    .cta-text {
      font-family: 'Oswald', sans-serif; font-size: 38px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase; color: #FFFFFF;
    }
    .cta-text span { color: #FFD200; }
    .hotline-btn {
      background: #FFD200; color: #080808;
      font-family: 'Oswald', sans-serif; font-size: 48px; font-weight: 700;
      letter-spacing: 1px; padding: 12px 32px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="top-bar">
    <div class="logo-container">
      <img src="../../assets/logo-derived/THO-DAT-MO_LOGO_HORIZONTAL_crop_v01.png" alt="THỢ ĐẤT MỎ">
    </div>
    <div class="top-tag" id="topTag">TẠI CẨM PHẢ</div>
  </div>

  <div class="hero-box">
    <div class="slide-num" id="slideNum">DỊCH VỤ 01/06</div>
    <div class="slide-icon" id="slideIcon"></div>
    <div class="main-title" id="mainTitle">TIÊU ĐỀ</div>
    <div class="desc-box" id="descBox">Mô tả</div>
  </div>

  <div class="bottom-cta">
    <div class="cta-text">
      CẦN THỢ? <span>GỌI THỢ ĐẤT MỎ</span>
    </div>
    <div class="hotline-btn">0888 942 247</div>
  </div>
</body>
</html>
