<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Facebook Cover Black — THỢ ĐẤT MỎ</title>
  <link rel="stylesheet" href="../assets/tokens.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1640px;
      height: 624px;
      background-color: var(--tdm-color-black);
      color: var(--tdm-color-white);
      font-family: var(--tdm-font-body);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 210, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 210, 0, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .accent-bar-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--tdm-color-yellow);
    }
    .accent-cut {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 260px;
      height: 260px;
      background: rgba(255, 210, 0, 0.03);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    /* Safe zone (center 1200px) */
    .safe-zone {
      width: 1200px;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 30px;
      z-index: 2;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    /* Logo container badge */
    .logo-container {
      background: #FFFFFF;
      padding: 10px 24px;
      border-radius: var(--tdm-radius-sm);
      display: flex;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      border-left: 6px solid var(--tdm-color-yellow);
    }
    .brand-logo-img {
      height: 70px;
      width: auto;
      display: block;
    }
    .location-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #181818;
      border: 1px solid #333333;
      padding: 12px 20px;
      border-radius: var(--tdm-radius-sm);
      font-family: var(--tdm-font-display);
      font-size: 16px;
      color: var(--tdm-color-yellow);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .main-copy {
      margin-bottom: 26px;
    }
    .promise-text {
      font-family: var(--tdm-font-display);
      font-size: 54px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .promise-text span {
      color: var(--tdm-color-yellow);
    }
    .services-tagline {
      font-size: 20px;
      font-weight: 500;
      color: #CCCCCC;
      letter-spacing: 0.3px;
    }
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #242424;
      padding-top: 24px;
    }
    .service-pills {
      display: flex;
      gap: 10px;
    }
    .pill {
      background: #181818;
      border: 1px solid #333333;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: var(--tdm-radius-sm);
      letter-spacing: 0.3px;
    }
    .hotline-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--tdm-color-yellow);
      color: var(--tdm-color-black);
      padding: 12px 24px;
      border-radius: var(--tdm-radius-sm);
      box-shadow: 0 4px 14px rgba(255, 210, 0, 0.25);
    }
    .hotline-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .hotline-number {
      font-family: var(--tdm-font-display);
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="accent-bar-top"></div>
  <div class="bg-grid"></div>
  <div class="accent-cut"></div>

  <div class="safe-zone">
    <div class="header-row">
      <div class="logo-container">
        <img src="../assets/logo-derived/THO-DAT-MO_LOGO_HORIZONTAL_transparent_v01.png" alt="THỢ ĐẤT MỎ" class="brand-logo-img">
      </div>
      <div class="location-badge">
        <span>●</span> CẨM PHẢ • QUẢNG NINH
      </div>
    </div>

    <div class="main-copy">
      <div class="promise-text">VIỆC KỸ THUẬT, <span>CÓ THỢ ĐẤT MỎ.</span></div>
      <div class="services-tagline">Đầu mối kết nối thợ kỹ thuật tại chỗ • Xử lý tận nơi • Báo giá rõ ràng</div>
    </div>

    <div class="footer-row">
      <div class="service-pills">
        <span class="pill">ĐIỀU HÒA / ĐIỆN LẠNH</span>
        <span class="pill">CAMERA</span>
        <span class="pill">ĐIỆN NƯỚC</span>
        <span class="pill">WI-FI & MẠNG</span>
        <span class="pill">MÁY TÍNH</span>
      </div>
      <div class="hotline-card">
        <div class="hotline-label">CẦN THỢ?<br>GỌI NGAY</div>
        <div class="hotline-number">0888 942 247</div>
      </div>
    </div>
  </div>
</body>
</html>
